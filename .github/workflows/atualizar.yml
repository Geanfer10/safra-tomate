name: Atualizar dados do painel

on:
  schedule:
    # A cada 10 minutos, das 6h às 20h59 (horário de Brasília), de segunda a sexta.
    # Obs.: o GitHub pode atrasar ou pular execuções agendadas em horários de pico.
    - cron: "*/10 9-23 * * 1-5"
  workflow_dispatch: {}

# Permissão mínima: só pode gravar no próprio repositório
permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Buscar dados e anexos no Monday
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          SAFRA_PADRAO: "2027"  # safra usada quando a coluna Safra estiver vazia
        run: python scripts/atualizar_dados.py

      - name: Publicar se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "Nada novo para publicar."
          else
            git commit -m "Atualiza dados do painel"
            git push
          fi
