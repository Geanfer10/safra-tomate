name: Atualizar dados do painel

on:
  schedule:
    # A cada hora, das 6h às 20h (horário de Brasília), de segunda a sábado
    - cron: "7 9-23 * * 1-6"
  workflow_dispatch: {}

# Permissão mínima: só pode gravar no próprio repositório
permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Buscar no Monday e criptografar
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
          SAFRA_PADRAO: "2027"  # safra usada quando a coluna Safra estiver vazia
        run: python scripts/atualizar_dados.py

      - name: Publicar se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dados.enc.json
          if git diff --cached --quiet; then
            echo "Nada novo para publicar."
          else
            git commit -m "Atualiza dados do painel (criptografados)"
            git push
          fi
